AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions deployment role for SozoRockSchool

Parameters:
  S3BucketName:
    Type: String
    Description: Existing S3 bucket that serves www.sozorock.com
  CloudFrontDistributionId:
    Type: String
    Description: Existing CloudFront distribution for www.sozorock.com
  S3Prefix:
    Type: String
    Default: meridian/
    AllowedPattern: "^[A-Za-z0-9._/-]+/$"
    Description: Existing S3 prefix served by the CloudFront origin
  BackupPrefix:
    Type: String
    Default: deployment-backups/sozorock-com/
    AllowedPattern: "^[A-Za-z0-9._/-]+/$"
    Description: S3 prefix reserved for recoverable production backups
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::791860731989:oidc-provider/token.actions.githubusercontent.com
    Description: Existing GitHub Actions OIDC provider in this AWS account

Resources:
  SozoRockComGitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sozorock-com-github-deploy
      Description: Deploys the SozoRockSchool static build to S3 and refreshes CloudFront
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:drolu-cmyk@271617784/sozorock-com@1356519279:environment:production
      Policies:
        - PolicyName: DeploySozoRockCom
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWebsiteBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3BucketName}
              - Sid: ListWebsiteAndBackupPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3BucketName}
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${S3Prefix}*"
                      - !Sub "${BackupPrefix}*"
              - Sid: ReplaceWebsiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/${S3Prefix}*"
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/${BackupPrefix}*"
              - Sid: InvalidateWebsiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}
Outputs:
  DeployRoleArn:
    Description: GitHub Actions role used by the production workflow
    Value: !GetAtt SozoRockComGitHubDeployRole.Arn
  S3BucketName:
    Description: Existing S3 bucket serving www.sozorock.com
    Value: !Ref S3BucketName
  S3Prefix:
    Description: Existing S3 prefix serving www.sozorock.com
    Value: !Ref S3Prefix
  BackupPrefix:
    Description: Prefix used for deployment backups
    Value: !Ref BackupPrefix
  CloudFrontDistributionId:
    Description: Existing CloudFront distribution serving www.sozorock.com
    Value: !Ref CloudFrontDistributionId
