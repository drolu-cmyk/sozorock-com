<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><link rel="canonical" href="https://www.sozorock.com/admin.html"><title>Staff administration | SozoRock Technology</title><link rel="stylesheet" href="/assets/admin.css"><link rel="icon" href="/favicon.svg"></head>
<body><main>
<p>SozoRock Technology · Staff access</p><h1>Enquiries & applications</h1>
<p id="admin-status" role="status" tabindex="-1">Sign in with your authorized administrator account.</p>
<button type="button" id="admin-login">Sign in</button><button type="button" id="admin-logout" hidden>Sign out</button>
<section id="admin-content" hidden aria-label="Received records">
<div class="admin-controls"><label>View records<select id="admin-view"><option value="applications">School applications</option><option value="enquiries">Corporate & CB-CAP enquiries</option></select></label><button type="button" id="admin-refresh">Refresh</button></div>
<div class="admin-controls" id="application-filters"><label>Search loaded applications<input type="search" id="admin-search" placeholder="Name, email or reference"></label><label>Program<select id="admin-program"><option value="">All programs</option><option value="applied-ai-systems">Applied AI Systems</option><option value="cybersecurity-grc">Cybersecurity GRC</option><option value="identity-access-management">Identity &amp; Access Management</option><option value="ai-governance">AI Governance</option></select></label><label>Status<select id="admin-filter-status"><option value="">All statuses</option></select></label><button type="button" id="admin-export">Export filtered records</button></div><p>Filters and export cover loaded records. Use Load more to include older records. Exports contain personal information; retain them only in approved staff storage.</p>
<p id="admin-count"></p><div id="admin-records"></div><button type="button" id="admin-more" hidden>Load more</button>
</section></main><script src="/applications-config.js"></script><script src="/admin.js" defer></script></body></html>
