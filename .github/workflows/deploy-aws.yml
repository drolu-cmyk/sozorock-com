name: Deploy www.sozorock.com
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: sozorock-com-production
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: python -m pip install 'playwright==1.58.0' 'boto3==1.43.90'
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance before authentication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preview-server.mjs >"$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python scripts/acceptance-public-site.py --base-url http://127.0.0.1:4173 --output-dir "$RUNNER_TEMP/evidence/school-local"
          python scripts/acceptance-corporate.py --base-url http://127.0.0.1:4173 --output-dir "$RUNNER_TEMP/evidence/corporate-local"
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::791860731989:role/sozorock-com-github-deploy
          role-session-name: sozorock-com-${{ github.run_id }}
          aws-region: us-east-1
          unset-current-credentials: true
      - name: Read separately verified operational acceptance
        run: |
          aws s3api get-object --bucket sozorock-meridian-site --key deployment-backups/sozorock-com/operational-acceptance.json --expected-bucket-owner 791860731989 "$RUNNER_TEMP/evidence/operational-acceptance.json"
      - name: Stage, activate, verify and recover on failure
        env:
          HEADERS_POLICY: ${{ vars.SOZOROCK_HEADERS_POLICY_ID }}
        run: |
          test -n "$HEADERS_POLICY"
          python scripts/release.py --activate --headers-policy "$HEADERS_POLICY" --evidence-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sozorock-release-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: warn
