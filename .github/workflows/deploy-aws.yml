name: Deploy www.sozorock.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sozorock-com-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_S3_BUCKET != '' && vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm run test:sites

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sozorock-com-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload versioned site assets
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: >-
          aws s3 sync dist/client "s3://${AWS_S3_BUCKET}"
          --delete
          --exclude index.html
          --cache-control "public,max-age=3600"

      - name: Upload the application shell
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: >-
          aws s3 cp dist/client/index.html "s3://${AWS_S3_BUCKET}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Refresh CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
