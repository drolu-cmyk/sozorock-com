name: Deploy www.sozorock.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sozorock-com-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  EXPECTED_AWS_ACCOUNT_ID: "149086500999"
  CANONICAL_URL: https://www.sozorock.com

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_S3_BUCKET != '' && vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm run test:sites

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sozorock-com-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Verify the AWS target
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID"
          aws s3api head-bucket --bucket "$AWS_S3_BUCKET"
          aliases="$(aws cloudfront get-distribution \
            --id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Aliases.Items' \
            --output json)"
          jq -e --arg domain "${CANONICAL_URL#https://}" 'index($domain)' <<<"$aliases" >/dev/null
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Publish, verify, and roll back automatically
        id: release
        shell: bash
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          backup_prefix="_deployment-backups/${GITHUB_RUN_ID}"
          backup_complete=0
          verified=0

          invalidate() {
            local invalidation_id
            invalidation_id="$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths '/*' \
              --query 'Invalidation.Id' \
              --output text)"
            aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" \
              --id "$invalidation_id"
          }

          rollback() {
            local status=$?
            trap - EXIT
            if [[ "$backup_complete" = '1' && "$verified" != '1' ]]; then
              echo "Verification failed. Restoring the previous S3 release."
              aws s3 sync "s3://${AWS_S3_BUCKET}/${backup_prefix}/" "s3://${AWS_S3_BUCKET}/" \
                --delete \
                --exclude '_deployment-backups/*'
              invalidate
            fi
            exit "$status"
          }
          trap rollback EXIT

          aws s3 sync "s3://${AWS_S3_BUCKET}/" "s3://${AWS_S3_BUCKET}/${backup_prefix}/" \
            --exclude '_deployment-backups/*'
          backup_complete=1

          aws s3 sync dist/client/ "s3://${AWS_S3_BUCKET}/" \
            --delete \
            --exclude 'index.html' \
            --exclude '_deployment-backups/*' \
            --cache-control 'public,max-age=3600'

          aws s3 cp dist/client/index.html "s3://${AWS_S3_BUCKET}/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

          invalidate

          page=''
          for attempt in $(seq 1 30); do
            page="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-time 20 "${CANONICAL_URL}/?release=${GITHUB_SHA}" || true)"
            if grep -Fq '<title>SozoRockSchool — Build the Technology. Earn the Trust.</title>' <<<"$page" \
              && grep -Fq 'Applied AI Systems' <<<"$page" \
              && grep -Fq 'Cybersecurity Identity and Access Management' <<<"$page" \
              && grep -Fq 'AI Governance' <<<"$page"; then
              verified=1
              break
            fi
            sleep 10
          done

          test "$verified" = '1'
          aws s3 rm "s3://${AWS_S3_BUCKET}/${backup_prefix}/" --recursive
          trap - EXIT
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Record the deployment result
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.release.outputs.verified }}' = 'true' ]]; then
            echo '## AWS deployment verified' >> "$GITHUB_STEP_SUMMARY"
            echo "Commit \`${GITHUB_SHA}\` is live at ${CANONICAL_URL}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## AWS deployment did not verify' >> "$GITHUB_STEP_SUMMARY"
            echo 'The workflow restored the previous S3 release when a backup was available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require a verified production release
        if: always()
        run: test '${{ steps.release.outputs.verified }}' = 'true'
