name: Review corporate and School experience
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build and test
        run: npm ci && npm run verify
      - name: Install browser checks
        run: python -m pip install 'playwright==1.58.0'
      - name: Review desktop and mobile journeys
        timeout-minutes: 10
        run: |
          CSP_MODE=enforce node scripts/preview-server.mjs > /tmp/school-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python scripts/acceptance-public-site.py --base-url http://127.0.0.1:4173 --output-dir /tmp/school-review/school
          python scripts/acceptance-corporate.py --base-url http://127.0.0.1:4173 --output-dir /tmp/school-review/corporate
      - name: Save rendered review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-review
          path: /tmp/school-review
          retention-days: 14
