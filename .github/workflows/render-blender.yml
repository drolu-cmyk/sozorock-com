name: Render editable Open School Blender scene
on:
  push:
    branches: [artwork/open-school-blender]
    paths: [artwork/blender/build_open_school.py, .github/workflows/render-blender.yml]
permissions:
  contents: write
concurrency:
  group: open-school-blender-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Blender and encoder
        run: sudo apt-get update -qq && sudo apt-get install -y blender ffmpeg
      - name: Render original scene
        run: blender -b -t 2 -P artwork/blender/build_open_school.py
      - name: Encode optimized loop and poster
        run: |
          ffmpeg -y -framerate 24 -i artwork/blender/generated/frames/frame_%04d.png -c:v libx264 -preset slow -crf 26 -pix_fmt yuv420p -movflags +faststart -an artwork/blender/generated/open-school.mp4
          ffmpeg -y -i artwork/blender/generated/frames/frame_0001.png -quality 88 artwork/blender/generated/open-school-poster.webp
      - name: Preserve editable source and reviewed-render candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artwork/blender/generated/open-school.blend artwork/blender/generated/open-school.mp4 artwork/blender/generated/open-school-poster.webp
          git diff --cached --quiet || git commit -m 'artwork: preserve original Blender source and encoded school loop'
          git push origin HEAD:artwork/open-school-blender
